<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORJAN | Estilo • Identidad • Diseño</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#000;
            color:#fff;
        }

        header{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;

            background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.70)),
            url("https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=1800&q=80");

            background-size:cover;
            background-position:center;

        }

        h1{

            font-size:90px;
            letter-spacing:15px;

        }

        h2{

            font-weight:300;
            letter-spacing:8px;
            margin-top:15px;

        }

        a{

            margin-top:45px;

            color:white;

            text-decoration:none;

            border:2px solid white;

            padding:18px 45px;

            transition:.4s;

        }

        a:hover{

            background:white;
            color:black;

        }

        section{

            max-width:1200px;

            margin:auto;

            padding:100px 40px;

        }

        .cards{

            display:grid;

            grid-template-columns:repeat(auto-fit,minmax(230px,1fr));

            gap:25px;

        }

        .card{

            background:#111;

            border-radius:15px;

            overflow:hidden;

        }

        .card img{

            width:100%;
            height:260px;
            object-fit:cover;

        }

        .card h3{

            padding:20px;

            text-align:center;

        }

        footer{

            text-align:center;

            padding:50px;

            border-top:1px solid #333;

        }

    </style>

</head>

<body>

<header>

<h1>KORJAN</h1>

<h2>ESTILO • IDENTIDAD • DISEÑO</h2>

<a href="#">PRÓXIMAMENTE</a>

</header>

<section>

<h2 style="text-align:center;margin-bottom:60px;">Colecciones</h2>

<div class="cards">

<div class="card">

<img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=80">

<h3>Casual</h3>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=900&q=80">

<h3>Sport</h3>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=80">

<h3>Formal</h3>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80">

<h3>Accesorios</h3>

</div>

</div>

</section>

<footer>

<h2>KORJAN</h2>

<p>Más que ropa, una identidad.</p>

<br>

<p>Instagram: @korjan</p>

<p>www.korjan.co.cr</p>

</footer>

</body>
</html>
